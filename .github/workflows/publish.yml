# Batch inference for the website: every hour, run SpotCast's model on the latest
# forecast and publish the results as JSON on the `site-data` branch. The Netlify site
# reads them from there. No server, no secrets, no cost.
#
# Scheduled workflows only run from the default branch (main). Run it by hand from the
# Actions tab with "Run workflow" (workflow_dispatch).

name: Publish site data

on:
  schedule:
    # Every hour (UTC); :17 avoids the busy top of the hour. Two problems, measured in
    # Nov 2026: GitHub skips many scheduled runs (about 2 a day ran, whether every 6 h or
    # every 3 h), and Open-Meteo refused the TLS connection from GitHub's shared runner
    # IPs in about 6 of 10 runs (it works from elsewhere; its terms say shared hosts hit
    # limits sooner). Each run gets another runner and usually another IP, so more
    # attempts mean more successful updates. A failed attempt is quiet while the site's
    # data is fresh (see spotcast.publish.main), and costs nothing in a public repo.
    - cron: "17 * * * *"
  workflow_dispatch:

# This job pushes the data branch, so it may write repository contents. Nothing else.
permissions:
  contents: write

# Never run two publishes at the same time; let a running one finish
concurrency:
  group: publish-site-data
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25 # training (when no model is cached) fetches ~6 min of paced history
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # Only the runtime dependencies: no torch, mlflow or LangGraph needed here
      - run: uv sync --locked --no-default-groups

      # Fallback while no model has been approved yet: train once, then reuse the cache
      - name: Cache the trained model
        uses: actions/cache@v4
        with:
          path: models
          key: model-${{ hashFiles('src/spotcast/labels.py', 'src/spotcast/model.py', 'src/spotcast/profiles.py', 'src/spotcast/config.py', 'src/spotcast/locations.toml', 'uv.lock') }}

      # The approved champion (see retrain.yml) always wins over the cached fallback
      - name: Use the approved model from the models branch
        run: |
          mkdir -p models
          if git fetch -q --depth 1 origin models; then
            git archive FETCH_HEAD | tar -x -C models
            echo "Using approved model:" && cat models/model_card.json
          else
            echo "No approved model yet: using the cached or freshly trained one."
          fi

      # Which Open-Meteo hosts answer from this runner, and how fast (on the run page).
      # Evidence for the "shared IP" problem above; it never fails the run.
      - name: Check Open-Meteo from this runner
        continue-on-error: true
        run: |
          {
            echo "### Open-Meteo from this runner"
            echo ""
            echo "| Host | HTTP | Connect (s) | TLS done (s) | Total (s) |"
            echo "|---|---|---|---|---|"
            for url in \
              "https://api.open-meteo.com/v1/forecast?latitude=38.24&longitude=26.38&hourly=wind_speed_10m" \
              "https://marine-api.open-meteo.com/v1/marine?latitude=38.24&longitude=26.38&hourly=wave_height" \
              "https://archive-api.open-meteo.com/v1/archive?latitude=38.24&longitude=26.38&start_date=2026-01-01&end_date=2026-01-02&hourly=wind_speed_10m" \
              "https://geocoding-api.open-meteo.com/v1/search?name=Izmir&count=1"; do
              host=$(echo "$url" | cut -d/ -f3)
              result=$(curl -sS -o /dev/null -m 20 \
                -A "SpotCast/1.0 (+https://github.com/boraozisik/spotcast-ai)" \
                -w "%{http_code} | %{time_connect} | %{time_appconnect} | %{time_total}" \
                "$url" 2>/dev/null) || result="failed (curl exit $?) | | |"
              echo "| $host | $result |"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # If Open-Meteo is unreachable while the live data is still fresh (< 12 h), this
      # step ends green with a warning and published=false; it fails (and e-mails) only
      # once the site's data is stale, or on bad data.
      - name: Compute the site data
        id: compute
        run: uv run --no-sync spotcast-publish --out site-data
        env:
          TZ: Europe/Istanbul

      # A fresh one-commit branch each time: the branch holds only the latest data,
      # so it never grows
      - name: Push to the site-data branch
        if: steps.compute.outputs.published == 'true'
        working-directory: site-data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b site-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Site data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" site-data
